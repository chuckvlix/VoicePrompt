[project]
name = "voiceprompt-backend"
version = "0.1.0"
description = "FastAPI backend for VoicePrompt with faster-whisper and LM Studio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "av<18",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
